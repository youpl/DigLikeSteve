name: OneDonjon CI

on:
  push:
    paths: ['onedonjon/**', '.github/workflows/onedonjon-ci.yml']
  pull_request:
    paths: ['onedonjon/**']

# Principe du moindre privilege : lecture seule du depot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onedonjon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build et tests
        run: sh gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OneDonjon
          path: onedonjon/build/libs/OneDonjon-*.jar
